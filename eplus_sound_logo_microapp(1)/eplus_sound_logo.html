      points="364,95 747,140 735,183 364,139"/>
    <!-- 2: средняя клавиша — звон монеты -->
    <polygon class="key" data-sound="coin"
      points="327,279 699,324 686,368 315,323"/>
    <!-- 3: нижняя клавиша — победа -->

<div class="hint">тапни по части логотипа</div>

<script>
let audioCtx;

function ctx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function tone(c, freq, start, duration, type="sine", volume=.08, endFreq=null) {
  const o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, start);
  if (endFreq !== null) o.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq), start+duration);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(volume, start+.008);
  g.gain.exponentialRampToValueAtTime(0.0001, start+duration);
  o.connect(g).connect(c.destination);
  o.start(start); o.stop(start+duration+.02);
}

function noise(c, start, duration, volume=.035) {
  const n = c.createBufferSource();
  const b = c.createBuffer(1, c.sampleRate*duration, c.sampleRate);
  const d = b.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1-i/d.length);
  const f = c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1800; f.Q.value=1.2;
  const g = c.createGain(); g.gain.setValueAtTime(volume,start); g.gain.exponentialRampToValueAtTime(.0001,start+duration);
  n.buffer=b; n.connect(f).connect(g).connect(c.destination); n.start(start);
}

function typewriter() {
  const c=ctx(), t=c.currentTime+.01;
  noise(c,t,.045,.055);
  tone(c,150,t,.045,"square",.045,95);
  setTimeout(()=>noise(c,.0,0),0);
}

function coin() {
  const c=ctx(), t=c.currentTime+.01;
  tone(c,1250,t,.22,"sine",.11,2100);
  tone(c,2050,t+.075,.34,"sine",.085,1500);
  tone(c,3100,t+.12,.16,"triangle",.035,2400);
}

function win() {
  const c=ctx(), t=c.currentTime+.01;
  const notes=[523.25,659.25,783.99,1046.5];
  notes.forEach((f,i)=>tone(c,f,t+i*.12,.34,"triangle",.07));
  tone(c,1568,t+.48,.65,"sine",.09,1174);
  tone(c,2093,t+.50,.55,"sine",.045,1568);
}

document.querySelectorAll(".key").forEach(k => {
  const play = () => {
    const s=k.dataset.sound;
    if(s==="typewriter") typewriter();
    if(s==="coin") coin();
    if(s==="win") win();
  };
  k.addEventListener("pointerdown", e => { e.preventDefault(); play(); });
});
</script>
